<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Southern Koch Christmas Wishlists</title>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
        body {
            background-color: #18181b;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .top {
            text-align: center;
            color: white;
            background-color: #211d1d;
            padding: 20px;
        }
        .wrapper {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1300px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
            align-items: start;
        }
        .card {
            background-color: #fbfbfa;
            border: 1px solid #2e1515;
            box-shadow: #827c7c 0px 0px 10px;
            border-radius: 10px;
            padding: 30px 20px;
            box-sizing: border-box;
        }
        .card h1 {
            color: #211d1d;
            margin-top: 0;
            font-size: 1.5rem;
        }
        .item-img {
            display: block;
            margin: 0 auto 10px auto;
            max-width: 100%;
            border-radius: 10px;
            object-fit: cover;
        }
        .btn {
            background-color: #0d0d0d;
            color: white;
            border: 1px solid #fbfbfa;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            font-size: 14px;
            margin-top: 8px;
        }
        .btn:hover {
            background-color: #4a4343;
        }
        .list-container {
            display: none;
            margin-top: 20px;
        }
        .items-box {
            color: #eae1e1;
            background-color: #342f2f;
            padding: 15px;
            font-size: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            line-height: 1.5;
            text-align: left;
        }
        .wishlist-item {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #4a4343;
        }
        .wishlist-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .item-link-btn {
            display: inline-block;
            margin: 8px auto 0 auto;
        }
    </style>
</head>
<body>
    <div class="top">
        <header>
            <h1 id="page-title">Southern Koch Christmas Wishlists</h1>
        </header>
    </div>

    <div id="wishlist-wrapper" class="wrapper"></div>

    <script>
        function formatSize(value, fallback = '100px') {
            if (value === undefined || value === null || value === '') {
                return fallback;
            }
            return typeof value === 'number' ? `${value}px` : String(value).trim();
        }

        function toggleList(personId, personName, btnEl) {
            const list = document.getElementById('list-' + personId);
            const isHidden = list.style.display === 'none' || list.style.display === '';

            if (isHidden) {
                list.style.display = 'block';
                btnEl.textContent = "Close " + personName + "'s List";
            } else {
                list.style.display = 'none';
                btnEl.textContent = "Open " + personName + "'s List";
            }
        }

        function renderWishlists(data) {
            if (data.title) {
                document.title = data.title;
                document.getElementById('page-title').textContent = data.title;
            }

            const wrapper = document.getElementById('wishlist-wrapper');
            wrapper.innerHTML = '';

            (data.people || []).forEach(person => {
                const card = document.createElement('div');
                card.className = 'card';

                const heading = document.createElement('h1');
                heading.textContent = `${person.name}'s List`;

                const btnContainer = document.createElement('div');
                btnContainer.className = 'btn-container';

                const toggleBtn = document.createElement('button');
                toggleBtn.className = 'btn';
                toggleBtn.textContent = `Open ${person.name}'s List`;
                toggleBtn.addEventListener('click', () => toggleList(person.id, person.name, toggleBtn));

                btnContainer.appendChild(toggleBtn);

                const listContainer = document.createElement('div');
                listContainer.id = `list-${person.id}`;
                listContainer.className = 'list-container';

                const itemsBox = document.createElement('div');
                itemsBox.className = 'items-box';

                (person.items || []).forEach((item, index) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'wishlist-item';

                    const img = document.createElement('img');
                    img.src = item.image;
                    img.alt = item.alt || item.title;
                    img.className = 'item-img';
                    img.style.width = formatSize(item.width, '100px');
                    img.style.height = formatSize(item.height, '100px');

                    const label = document.createTextNode(`${index + 1}. ${item.title}`);
                    const br = document.createElement('br');

                    const linkBtn = document.createElement('button');
                    linkBtn.className = 'btn item-link-btn';
                    linkBtn.textContent = 'Item Link';
                    linkBtn.addEventListener('click', () => window.open(item.url, '_blank', 'noopener,noreferrer'));

                    itemDiv.appendChild(img);
                    itemDiv.appendChild(label);
                    itemDiv.appendChild(br);
                    itemDiv.appendChild(linkBtn);
                    itemsBox.appendChild(itemDiv);
                });

                listContainer.appendChild(itemsBox);
                card.appendChild(heading);
                card.appendChild(btnContainer);
                card.appendChild(listContainer);
                wrapper.appendChild(card);
            });
        }

        fetch('wishlists.yml')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to load wishlists.yml (${response.status})`);
                }
                return response.text();
            })
            .then(yamlText => {
                const data = jsyaml.load(yamlText);
                renderWishlists(data);
            })
            .catch(err => {
                document.getElementById('wishlist-wrapper').innerHTML =
                    `<p style="color: #fca5a5;">Could not load wishlists.yml: ${err.message}</p>`;
            });
    </script>
</body>
</html>
